# File-descriptor limit for nginx.
#
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo cp nginx-limits.conf /etc/systemd/system/nginx.service.d/limits.conf
#   sudo systemctl daemon-reload && sudo systemctl restart nginx
#
# A reload of this deployment hit the default limit:
#
#   [alert] socketpair() failed while spawning "worker process"
#           (24: Too many open files)
#   [alert] worker process 1384434 exited with fatal code 2
#           and cannot be respawned
#
# That is the master process running out of descriptors while forking a
# worker -- and a worker that "cannot be respawned" is capacity that does
# not come back until nginx is restarted.
#
# Why it happens here rather than on a busy site: Ubuntu ships
# `worker_connections 768`, a reverse-proxied connection holds two
# descriptors (client and upstream), and systemd's default soft limit is
# 1024. Reloading is what tips it over -- old workers keep serving their
# existing connections while new ones start, so the requirement briefly
# doubles.
#
# Shiny then makes the connections long-lived rather than transient: an
# open tab holds a WebSocket for hours, so descriptors accumulate instead
# of being returned between requests, and a 500 MB upload holds one for
# the length of the upload.
#
# A drop-in rather than an edit to /etc/nginx/nginx.conf: nginx's own
# `worker_rlimit_nofile` is a main-context directive with nowhere to be
# included from on Ubuntu, so setting it means editing a packaged file
# that the next nginx upgrade will ask about.
#
# 16384 is far more than four users need. The number is not a capacity
# estimate -- it is chosen to be past the point where this is ever the
# constraint again, since the cost of headroom is nothing and the cost of
# being wrong is workers that die during a reload.

[Service]
LimitNOFILE=16384
