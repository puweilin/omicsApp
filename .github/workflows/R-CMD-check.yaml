# Run R CMD check on both omicsCore and omicsApp.
#
# omicsCore is checked first; omicsApp depends on it via a local
# Remotes entry, so it runs after omicsCore passes.
#
# Suggests-not-installed is a NOTE (not WARNING) so we don't fail
# when a Bioconductor Suggests temporarily won't install.
name: R-CMD-check

on:
  push:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - ".github/workflows/R-CMD-check.yaml"
  workflow_dispatch:

jobs:
  check-omicscore:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/omicsCore
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/omicsCore
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  check-omicsapp:
    runs-on: ubuntu-latest
    needs: check-omicscore

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Single setup-r-dependencies: installs omicsCore (from ../omicsCore)
      # + its deps, then omicsApp deps. One Post step → no cache-key contention
      # with the concurrent check-omicscore job.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/omicsApp
          extra-packages: |
            local::../omicsCore
            any::rcmdcheck
            any::devtools
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/omicsApp
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
