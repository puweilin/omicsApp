# Run R CMD check on both omicsCore and omicsApp in a single job.
#
# omicsCore is checked first; its installed dependencies are reused when
# omicsCore + omicsApp deps are installed next, avoiding redundant
# compilation and a second cache Post-step.
#
# Suggests-not-installed is a NOTE (not WARNING) so we don't fail
# when a Bioconductor Suggests temporarily won't install.
name: R-CMD-check

on:
  push:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - ".github/workflows/R-CMD-check.yaml"
  pull_request:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - ".github/workflows/R-CMD-check.yaml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # 1. Install omicsCore deps (limma, clusterProfiler, msigdbr, qs2, …)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/omicsCore
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      # 2. Check omicsCore
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/omicsCore
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      # 3. Now add omicsCore + omicsApp deps. omicsCore deps from step 1
      #    are already installed, so pak only builds omicsCore + omicsApp
      #    additions (shiny, bslib, DT, plotly, …).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/omicsApp
          extra-packages: |
            local::../omicsCore
            any::rcmdcheck
            any::devtools
          needs: check

      # 4. Check omicsApp
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/omicsApp
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
