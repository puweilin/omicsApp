# Build the production image and run both test suites inside it.
#
# R-CMD-check.yaml tests on the latest R release with today's CRAN. The
# server runs deploy/docker/Dockerfile: R 4.4.2, Bioconductor 3.20 and a
# CRAN snapshot pinned to 2025-03-01. Code that passed the first could
# fail on the second (an API that did not exist yet, a package version
# that behaves differently), and nothing ever built the Dockerfile, so
# the first sign of a broken image was a failed deployment. This job
# builds that image and tests the packages as installed in it.
name: production-image

on:
  pull_request:
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - "deploy/**"
      - ".github/workflows/production-image.yaml"
  push:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - "deploy/**"
      - ".github/workflows/production-image.yaml"
  # Weekly, so a base image or mirror that moved is noticed before a
  # deployment depends on it.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    # The first build compiles the Bioconductor stack from source; later
    # builds reuse the cached layers up to the package COPY.
    timeout-minutes: 180
    env:
      IMAGE: omicsapp:ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The image is several GB (Bioconductor, TeX); the runner's free
      # space is not enough without clearing toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same immutable tag deploy/scripts/build_image.sh gives a
      # build on the server, <version>-<commit>, so an image from CI and
      # one from the server are named alike and never only `latest`.
      - name: Work out the image tag
        id: tag
        run: |
          version="$(sed -nE 's/^Version:[[:space:]]*([^[:space:]]+).*$/\1/p' packages/omicsApp/DESCRIPTION | head -n 1)"
          {
            echo "version=$version"
            echo "immutable=omicsapp:${version}-${GITHUB_SHA:0:12}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile's default Bioconductor mirror is chosen for the
      # server's network; from GitHub the upstream is the fast one.
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}
            ${{ steps.tag.outputs.immutable }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
          build-args: |
            BIOC_MIRROR=https://bioconductor.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as confined as Docker allows -- read-only root, writes only to
      # the tmpfs mounts, no capabilities, no privilege gain, a process
      # cap and the production memory and CPU limits -- so the app is
      # known to work that way. ShinyProxy cannot apply all of this
      # (see application.yml), but compose, the restore drill and any
      # future backend can, and an app that quietly started writing to
      # its root filesystem would fail here first.
      - name: The image serves the app, confined
        run: |
          docker run -d --name smoke -p 3838:3838 \
            --read-only --tmpfs /tmp:rw,exec,size=1g --tmpfs /home/omics --tmpfs /data \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 6g --cpus 2 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3838/; then
              echo "up after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3838/ | grep -qi "omics"
          docker logs smoke
          docker rm -f smoke

      # The packages' tests against the libraries in the image. Test-only
      # packages come from the image's own pinned repositories, so they
      # are the versions that snapshot carries.
      - name: Test omicsCore and omicsApp inside the image
        run: |
          docker run --rm --user root -v "$PWD:/src" -w /src \
            -e NOT_CRAN=true -e OMICSAPP_DATA_DIR=/tmp/omicsapp-data \
            "$IMAGE" bash -euo pipefail -c '
              Rscript -e "install.packages(c(\"testthat\", \"withr\", \"writexl\"), Ncpus = 2)"
              Rscript -e "res <- testthat::test_local(\"packages/omicsCore\", reporter = \"summary\", stop_on_failure = TRUE)"
              Rscript -e "res <- testthat::test_local(\"packages/omicsApp\", reporter = \"summary\", stop_on_failure = TRUE)"
            '

      - name: The deploy scripts parse
        run: |
          for s in deploy/scripts/*.sh; do bash -n "$s"; done

      # Weekly: has a registry moved a pinned tag? Informational -- taking
      # the new digest is a deliberate change (pin_base_digests.sh, then a
      # rebuild and test), not something CI does on its own.
      - name: Base image digests against their registries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: deploy/scripts/pin_base_digests.sh --check
