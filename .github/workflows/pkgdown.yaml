# Build and deploy pkgdown sites for omicsCore and omicsApp to gh-pages.
#
# Triggers on push to main when either package changes.
# Both sites are nested under /omicsCore/ and /omicsApp/ on the
# gh-pages branch so GitHub Pages serves them as:
#   https://<owner>.github.io/omicsApp/omicsCore/
#   https://<owner>.github.io/omicsApp/omicsApp/
name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - "packages/omicsCore/**"
      - "packages/omicsApp/**"
      - ".github/workflows/pkgdown.yaml"
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # The deploy step pushes the gh-pages branch. The repository's default
    # token is read-only, so the job asks for write access to contents
    # explicitly; without it the push is a 403 with no further explanation.
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: packages/omicsCore
          extra-packages: |
            any::pkgdown
          needs: check

      - name: Build omicsCore pkgdown site
        run: |
          Rscript -e 'pkgdown::build_site("packages/omicsCore")'
        shell: bash

      - name: Build omicsApp pkgdown site
        run: |
          R CMD INSTALL packages/omicsCore
          Rscript -e 'pkgdown::build_site("packages/omicsApp")'
        shell: bash

      - name: Stage docs for deploy
        run: |
          mkdir -p gh-pages-deploy/omicsCore
          mkdir -p gh-pages-deploy/omicsApp
          cp -R packages/omicsCore/docs/* gh-pages-deploy/omicsCore/
          cp -R packages/omicsApp/docs/* gh-pages-deploy/omicsApp/
          touch gh-pages-deploy/.nojekyll
        shell: bash

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-deploy
          publish_branch: gh-pages
          force_orphan: true
