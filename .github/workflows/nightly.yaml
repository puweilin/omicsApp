# The tests too slow or too heavy for every push, every night.
#
#   perf  test-perf-budget.R with OMICSCORE_PERF_TESTS=1: import, PCA,
#         re-thresholding and limma at the size the app is used on
#         (63k genes x 258 samples). The data is generated by the test
#         itself -- nothing private is needed. The ceilings are about
#         three times what a laptop needs, so they catch a change of
#         algorithm rather than a slow runner; a failure here is worth
#         reading even if a rerun passes.
#   fuzz  test-api-contract.R with OMICSCORE_FUZZ_TESTS=1: the argument
#         sweep over the heavy engines (edgeR, ORA, integration, GSVA,
#         the report), which takes minutes rather than seconds. Its gene
#         sets come from msigdbr; msigdbr 10 and later keeps them in
#         msigdbdf, which is not on CRAN, hence the extra repository.
#
# Both also run on demand (Actions > nightly > Run workflow). Locally:
#
#   OMICSCORE_PERF_TESTS=1 Rscript -e 'testthat::test_local("packages/omicsCore", filter = "perf-budget")'
#   OMICSCORE_FUZZ_TESTS=1 Rscript -e 'testthat::test_local("packages/omicsCore", filter = "api-contract")'
name: nightly

on:
  schedule:
    # 02:37 UTC: off the hour, when scheduled runs queue up.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-tests:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # must_run: the tests (by name, a regular expression) that are
        # the point of the job; one of them skipping fails it.
        suite:
          - { name: perf, filter: perf-budget, flag: OMICSCORE_PERF_TESTS, must_run: "." }
          - { name: fuzz, filter: api-contract, flag: OMICSCORE_FUZZ_TESTS, must_run: "heavy engines" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      OMICSAPP_REPO_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://igordot.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: packages/omicsCore
          cache-version: 2
          extra-packages: |
            any::devtools
            any::msigdbdf
          needs: check

      - name: Run the ${{ matrix.suite.name }} tests
        env:
          SUITE_FLAG: ${{ matrix.suite.flag }}
          SUITE_FILTER: ${{ matrix.suite.filter }}
          SUITE_MUST_RUN: ${{ matrix.suite.must_run }}
        shell: Rscript {0}
        run: |
          flag <- Sys.getenv("SUITE_FLAG")
          do.call(Sys.setenv, stats::setNames(list("1"), flag))
          res <- testthat::test_local("packages/omicsCore", filter = Sys.getenv("SUITE_FILTER"),
                                      reporter = "summary", stop_on_failure = TRUE)
          # A gated test that still skipped (a missing engine, the flag
          # not read) would make this job pass without running anything.
          skipped <- unlist(lapply(res, function(r) {
            s <- Filter(function(e) inherits(e, "expectation_skip"), r$results)
            if (length(s)) paste0(r$test, ": ", conditionMessage(s[[1L]]))
          }))
          if (length(skipped)) cat("Skipped:", skipped, sep = "\n  ")
          if (any(grepl(Sys.getenv("SUITE_MUST_RUN"), sub(": .*$", "", skipped)))) {
            stop("a ", flag, " test did not run")
          }
